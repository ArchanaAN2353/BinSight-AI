<!DOCTYPE html>
<html>
<head>
    <title>Prediction History</title>

    <style>

        body{
            margin:0;
            padding:20px 0;

            font-family:Arial,sans-serif;

            background:url("{{ url_for('static', filename='images/bg.jpg') }}");
            background-size:cover;
            background-position:center;
            background-attachment:fixed;

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:flex-start;

            overflow-y:auto;
        }

        body::before{
            content:"";
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;

            background:rgba(0,0,0,0.35);

            z-index:-1;
        }

        /* MAIN CONTAINER */

        .container{

            width:82%;
            max-width:1100px;

            background:rgba(255,255,255,0.10);

            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);

            border:1px solid rgba(255,255,255,0.12);

            border-radius:24px;

            padding:24px;

            box-shadow:
                0 6px 20px rgba(0,0,0,0.18),
                inset 0 0 10px rgba(255,255,255,0.03);

            margin:18px auto;
        }

        /* HEADER */

        .header{

            display:flex;
            justify-content:space-between;
            align-items:center;

            margin-bottom:25px;
        }

        .header h1{

            margin:0;

            color:white;

            font-size:42px;

            text-shadow:0 0 10px rgba(255,255,255,0.4);
        }

        .header-buttons{
            display:flex;
            gap:12px;
        }

        .header a,
        .header button{

            padding:12px 20px;

            border:none;

            border-radius:14px;

            font-size:15px;
            font-weight:bold;

            cursor:pointer;

            text-decoration:none;

            transition:0.3s ease;

            color:white;
        }

        .header a{
            background:rgba(76,175,80,0.85);
        }

        .header button{
            background:rgba(244,67,54,0.85);
        }

        .header a:hover,
        .header button:hover{
            transform:translateY(-2px);
        }

        /* CATEGORY SECTION */

        .categories{

            display:grid;
            grid-template-columns:repeat(4,1fr);

            gap:18px;

            margin-bottom:25px;
        }

        .category{

            background:rgba(255,255,255,0.08);

            border:1px solid rgba(255,255,255,0.12);

            backdrop-filter:blur(10px);

            border-radius:20px;

            padding:18px;

            text-align:center;

            cursor:pointer;

            transition:0.3s ease;

            color:white;
        }

        .category:hover{
            transform:translateY(-4px);
            background:rgba(255,255,255,0.14);
        }

        .category img{
            width:85px;
            transition:0.3s ease;
        }

        .category:hover img{
            transform:scale(1.08);
        }

        .category-title{
            margin-top:10px;
            font-size:17px;
            font-weight:bold;
        }

        .count{
            margin-top:6px;
            font-size:15px;
            opacity:0.9;
        }

        /* IMAGE DISPLAY */

        .images{

            min-height:350px;

            background:rgba(255,255,255,0.08);

            border:1px solid rgba(255,255,255,0.12);

            backdrop-filter:blur(10px);

            border-radius:20px;

            padding:18px;

            display:grid;

            grid-template-columns:
            repeat(auto-fill,minmax(180px,1fr));

            gap:18px;

            overflow-y:auto;
        }

        .history-card{

            background:rgba(255,255,255,0.10);

            border-radius:18px;

            overflow:hidden;

            border:1px solid rgba(255,255,255,0.10);

            transition:0.3s ease;
        }

        .history-card:hover{
            transform:translateY(-4px);
        }

        .history-card img{

            width:100%;
            height:170px;

            object-fit:cover;
        }

        .history-info{
            padding:12px;
            color:white;
            text-align:center;
        }

        .history-info p{
            margin:6px 0;
            font-size:14px;
        }

        /* EMPTY */

        .no-data{

            color:white;

            text-align:center;

            width:100%;

            margin-top:100px;

            font-size:20px;
        }

        /* SHAKE */

        @keyframes shake{

            0% { transform:translateX(0); }
            25% { transform:translateX(-5px); }
            50% { transform:translateX(5px); }
            75% { transform:translateX(-5px); }
            100% { transform:translateX(0); }
        }

        .shake{
            animation:shake 0.4s;
        }

        /* MOBILE */

        @media(max-width:950px){

            .categories{
                grid-template-columns:repeat(2,1fr);
            }

            .header{
                flex-direction:column;
                gap:18px;
            }

            .header h1{
                font-size:34px;
                text-align:center;
            }
        }

        @media(max-width:600px){

            .categories{
                grid-template-columns:1fr;
            }

            .container{
                width:92%;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>Prediction History</h1>

        <div class="header-buttons">

            <a href="/">🏠 Home</a>

            <button onclick="clearHistory()">
                🧹 Clear
            </button>

        </div>

    </div>

    <!-- CATEGORIES -->

    <div class="categories">

        <div class="category"
             onclick="showImages(event,'biodegradable')">

            <img src="{{ url_for('static', filename='biodegradable.png') }}">

            <div class="category-title">
                Biodegradable
            </div>

            <div class="count">
                {{ history['biodegradable']|length }} Images
            </div>

        </div>

        <div class="category"
             onclick="showImages(event,'recyclable')">

            <img src="{{ url_for('static', filename='recyclable.png') }}">

            <div class="category-title">
                Recyclable
            </div>

            <div class="count">
                {{ history['recyclable']|length }} Images
            </div>

        </div>

        <div class="category"
             onclick="showImages(event,'non_recyclable')">

            <img src="{{ url_for('static', filename='non_recyclable.png') }}">

            <div class="category-title">
                Non-Recyclable
            </div>

            <div class="count">
                {{ history['non_recyclable']|length }} Images
            </div>

        </div>

        <div class="category"
             onclick="showImages(event,'hazardous')">

            <img src="{{ url_for('static', filename='hazardous.png') }}">

            <div class="category-title">
                Hazardous
            </div>

            <div class="count">
                {{ history['hazardous']|length }} Images
            </div>

        </div>

    </div>

    <!-- IMAGE CONTAINER -->

    <div id="imageContainer" class="images">

        <div class="no-data">
            Select a category to view images
        </div>

    </div>

</div>

<script>

const history = {{ history|tojson }};

function showImages(event, category){

    const container =
        document.getElementById("imageContainer");

    container.innerHTML = "";

    const box = event.currentTarget;

    box.classList.add("shake");

    setTimeout(()=>{
        box.classList.remove("shake");
    },400);

    if(history[category] &&
       history[category].length > 0){

        history[category].forEach((item)=>{

            container.innerHTML += `

                <div class="history-card">

                    <img src="${item.image}">

                    <div class="history-info">

                        <p>
                            <b>Confidence:</b>
                            ${item.confidence}%
                        </p>

                    </div>

                </div>
            `;
        });

    }

    else{

        container.innerHTML = `
            <div class="no-data">
                No images found
            </div>
        `;
    }
}

function clearHistory(){

    if(confirm("Clear all history?")){

        fetch("/clear_history",{
            method:"POST"
        })

        .then(res => res.json())

        .then(data => {

            alert(data.message);

            location.reload();
        });
    }
}

</script>

</body>
</html>
